<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>btsSong — Lyrics</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding: 2rem; max-width: 800px; margin: auto; }
      pre { white-space: pre-wrap; background:#f8f8f8; padding:1rem; border-radius:6px }
    </style>
  </head>
  <body>
    <h1>btsSong</h1>
    <p>This is a minimal example page. It will display the contents of <code>lyrics.txt</code> if your browser allows fetching it locally (some browsers block local file fetches).</p>
    <pre id="lyrics">Loading lyrics.txt ...</pre>
    <script>
      fetch('lyrics.txt').then(r => r.text()).then(t => { document.getElementById('lyrics').textContent = t }).catch(()=>{ document.getElementById('lyrics').textContent = 'Unable to load lyrics.txt from the filesystem — open this file via a webserver or edit the HTML to include lyrics inline.'})
    </script>
  </body>
</html>
